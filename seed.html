<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Seed database</title></head>
<body style="font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px">
<h1>Seed database</h1>
<p>Run once after setting up config.js. Creates the admin account and the employee list. Delete this file afterwards.</p>
<button id="go">Write seed data</button>
<pre id="out"></pre>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="seed-data.js"></script>
<script>
document.getElementById('go').onclick = async function () {
  var out = document.getElementById('out');
  try {
    firebase.initializeApp(window.FIREBASE_CONFIG);
    var db = firebase.firestore();
    if ((await db.doc('config/main').get()).exists) { out.textContent = 'Already seeded. Nothing written.'; return; }
    var b = db.batch();
    b.set(db.doc('config/main'), SEED.config);
    SEED.employees.forEach(function (e) {
      b.set(db.doc('employees/' + e.code), { name: e.name, order: e.order, counted: true });
    });
    await b.commit();
    out.textContent = 'Done. ' + SEED.employees.length + ' employees written. Delete seed.html and seed-data.js.';
  } catch (e) { out.textContent = 'Failed: ' + e.message; }
};
</script></body></html>
